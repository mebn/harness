<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- iOS app icon outline (continuous, squircle corners) -->
    <clipPath id="shape"><path d="M0.0 360.0L0.1 294.9L0.4 267.9L0.9 247.3L1.5 229.9L2.4 214.7L3.5 201.0L4.7 188.5L6.2 176.9L7.8 166.0L9.7 155.9L11.7 146.3L14.0 137.3L16.4 128.7L19.1 120.6L21.9 112.8L25.0 105.4L28.3 98.4L31.7 91.7L35.4 85.2L39.3 79.1L43.5 73.3L47.8 67.7L52.4 62.4L57.3 57.3L62.4 52.4L67.7 47.8L73.3 43.5L79.1 39.3L85.2 35.4L91.7 31.7L98.4 28.3L105.4 25.0L112.8 21.9L120.6 19.1L128.7 16.4L137.3 14.0L146.3 11.7L155.9 9.7L166.0 7.8L176.9 6.2L188.5 4.7L201.0 3.5L214.7 2.4L229.9 1.5L247.3 0.9L267.9 0.4L294.9 0.1L360.0 0.0L664.0 0.0L729.1 0.1L756.1 0.4L776.7 0.9L794.1 1.5L809.3 2.4L823.0 3.5L835.5 4.7L847.1 6.2L858.0 7.8L868.1 9.7L877.7 11.7L886.7 14.0L895.3 16.4L903.4 19.1L911.2 21.9L918.6 25.0L925.6 28.3L932.3 31.7L938.8 35.4L944.9 39.3L950.7 43.5L956.3 47.8L961.6 52.4L966.7 57.3L971.6 62.4L976.2 67.7L980.5 73.3L984.7 79.1L988.6 85.2L992.3 91.7L995.7 98.4L999.0 105.4L1002.1 112.8L1004.9 120.6L1007.6 128.7L1010.0 137.3L1012.3 146.3L1014.3 155.9L1016.2 166.0L1017.8 176.9L1019.3 188.5L1020.5 201.0L1021.6 214.7L1022.5 229.9L1023.1 247.3L1023.6 267.9L1023.9 294.9L1024.0 360.0L1024.0 664.0L1023.9 729.1L1023.6 756.1L1023.1 776.7L1022.5 794.1L1021.6 809.3L1020.5 823.0L1019.3 835.5L1017.8 847.1L1016.2 858.0L1014.3 868.1L1012.3 877.7L1010.0 886.7L1007.6 895.3L1004.9 903.4L1002.1 911.2L999.0 918.6L995.7 925.6L992.3 932.3L988.6 938.8L984.7 944.9L980.5 950.7L976.2 956.3L971.6 961.6L966.7 966.7L961.6 971.6L956.3 976.2L950.7 980.5L944.9 984.7L938.8 988.6L932.3 992.3L925.6 995.7L918.6 999.0L911.2 1002.1L903.4 1004.9L895.3 1007.6L886.7 1010.0L877.7 1012.3L868.1 1014.3L858.0 1016.2L847.1 1017.8L835.5 1019.3L823.0 1020.5L809.3 1021.6L794.1 1022.5L776.7 1023.1L756.1 1023.6L729.1 1023.9L664.0 1024.0L360.0 1024.0L294.9 1023.9L267.9 1023.6L247.3 1023.1L229.9 1022.5L214.7 1021.6L201.0 1020.5L188.5 1019.3L176.9 1017.8L166.0 1016.2L155.9 1014.3L146.3 1012.3L137.3 1010.0L128.7 1007.6L120.6 1004.9L112.8 1002.1L105.4 999.0L98.4 995.7L91.7 992.3L85.2 988.6L79.1 984.7L73.3 980.5L67.7 976.2L62.4 971.6L57.3 966.7L52.4 961.6L47.8 956.3L43.5 950.7L39.3 944.9L35.4 938.8L31.7 932.3L28.3 925.6L25.0 918.6L21.9 911.2L19.1 903.4L16.4 895.3L14.0 886.7L11.7 877.7L9.7 868.1L7.8 858.0L6.2 847.1L4.7 835.5L3.5 823.0L2.4 809.3L1.5 794.1L0.9 776.7L0.4 756.1L0.1 729.1L0.0 664.0Z"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3d9bff"/>
      <stop offset="0.5" stop-color="#1c6be0"/>
      <stop offset="1" stop-color="#0b3c99"/>
    </linearGradient>
    <!-- The bulge: a dome lit from the top left (focal point up and left), fading into the flat sheet -->
    <radialGradient id="dome" cx="512" cy="512" r="450" fx="360" fy="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ad6ff"/>
      <stop offset="0.3" stop-color="#5cacff"/>
      <stop offset="0.62" stop-color="#2a7cec"/>
      <stop offset="0.86" stop-color="#1a62d6"/>
      <stop offset="1" stop-color="#1c6be0"/>
    </radialGradient>
    <radialGradient id="domeFade" cx="512" cy="512" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#fff"/>
      <stop offset="0.7" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="0.86" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- light falling on the upper-left slope, shade on the lower-right slope -->
    <linearGradient id="slope" x1="0.15" y1="0.15" x2="0.85" y2="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#001540" stop-opacity="0"/>
      <stop offset="1" stop-color="#001540" stop-opacity="0.6"/>
    </linearGradient>
    <mask id="fade"><rect width="1024" height="1024" fill="url(#domeFade)"/></mask>
    <!-- a soft sheen along the upper-left slope -->
    <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- the ball -->
    <radialGradient id="ball" cx="0.35" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#eef4ff"/>
      <stop offset="0.55" stop-color="#a9c3ea"/>
      <stop offset="0.82" stop-color="#5677b3"/>
      <stop offset="1" stop-color="#2b4a86"/>
    </radialGradient>
    <!-- blue light thrown back onto the ball by the sheet -->
    <radialGradient id="bounce" cx="0.62" cy="0.8" r="0.55">
      <stop offset="0" stop-color="#4fa2ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4fa2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- where the stretched sheet hugs the ball's equator -->
    <radialGradient id="seam" cx="512" cy="512" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0.88" stop-color="#00113a" stop-opacity="0"/>
      <stop offset="0.91" stop-color="#00113a" stop-opacity="0.45"/>
      <stop offset="0.97" stop-color="#00113a" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- the bulge in the sheet -->
    <circle cx="512" cy="512" r="450" fill="url(#dome)" mask="url(#fade)"/>
    <circle cx="512" cy="512" r="450" fill="url(#slope)" mask="url(#fade)"/>
    <ellipse cx="372" cy="372" rx="150" ry="70" fill="url(#sheen)" transform="rotate(-45 372 372)"/>

    <!-- contact shadow the ball drops onto the lower right of the bulge -->
    <circle cx="526" cy="534" r="230" fill="#001033" opacity="0.4" filter="url(#blur)"/>
    <circle cx="512" cy="512" r="250" fill="url(#seam)"/>

    <!-- the ball, half out of the sheet -->
    <circle cx="512" cy="512" r="226" fill="url(#ball)"/>
    <circle cx="512" cy="512" r="226" fill="url(#bounce)"/>
    <ellipse cx="438" cy="408" rx="92" ry="60" fill="url(#spec)" transform="rotate(-38 438 408)"/>
    <circle cx="512" cy="512" r="225" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
